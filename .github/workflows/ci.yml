name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 0'
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quick-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Quick verify
        run: npm run verify:quick

  runtime-full-verify:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime full verify
        run: npm run verify:runtime-full

      - name: Full release verify
        run: npm run verify:full-release
