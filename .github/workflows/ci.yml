name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run verify:integration

      - name: Commercial hardening verify
        run: npx tsx src/verify/runCommercialHardening.verify.ts
        env:
          NODE_OPTIONS: --require ./scripts/react-native-stub-register.cjs

      - name: Security verify
        run: npm run verify:security

      - name: Diagnostics verify
        run: npm run verify:diagnostics

      - name: Release verify
        run: npm run verify:release

      - name: Full test suite
        run: npm test
